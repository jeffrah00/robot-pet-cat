# High-level VLA fine-tuning config. Phase 4.

base_model: lerobot/smolvla_base

dataset:
  hf_repo: ${HF_USERNAME}/cat-behaviors
  split: train
  image_size: 256
  history_frames: 4
  goal_tokens:
    - explore
    - rest
    - play
    - follow
    - hunt

action_space:
  # The VLA outputs a *high-level* command. The low-level locomotion controller
  # consumes it. Keep this small — too rich an action space is hard to learn from
  # video alone.
  fields:
    - { name: vx,         range: [-1.0, 1.5] }
    - { name: vy,         range: [-0.5, 0.5] }
    - { name: yaw,        range: [-1.0, 1.0] }
    - { name: gait,       discrete: [stand, walk, trot, crouch, leap] }
    - { name: head_pitch, range: [-0.4, 0.4] }
    - { name: tail_pose,  range: [-0.5, 0.5] }

train:
  epochs: 10
  batch_size: 32
  learning_rate: 1.0e-4
  warmup_steps: 500
  gradient_accumulation: 2
  mixed_precision: bf16

logging:
  wandb_project: robot-pet-cat
  wandb_run_name: smolvla-cat-v1
  eval_interval_epochs: 1

output:
  hf_repo: ${HF_USERNAME}/smolvla-cat
  push_to_hub: true
