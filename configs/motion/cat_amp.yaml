# AMP-trained cat-style Go2 locomotion config.
# Consumed by `rpc train-motion --config configs/motion/cat_amp.yaml`.
# Maps onto src/robot_pet_cat/motion/amp_trainer.py:AMPTrainConfig.

# --- AMP scalars -----------------------------------------------------------
motion_clips_dir: data/motion_clips
style_reward_weight: 2.0       # lambda on r_style in the augmented reward
task_reward_weight: 1.0
use_qvel_in_features: false    # include qvel in D's input? false = qpos only

# --- Discriminator hyperparams --------------------------------------------
disc_hidden_sizes: [1024, 512]
disc_grad_penalty_coef: 10.0
disc_learning_rate: 0.0001
disc_batch_size: 4096
disc_updates_per_iter: 1

# --- Env -------------------------------------------------------------------
env_name: Go2JoystickFlatTerrain
num_envs: 4096
episode_length_s: 20.0

# --- PPO -------------------------------------------------------------------
ppo:
  total_timesteps: 50000000
  unroll_length: 20
  num_minibatches: 32
  num_updates_per_batch: 4
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  entropy_cost: 0.01
  learning_rate: 0.0003
  max_grad_norm: 1.0
  policy_hidden_sizes: [512, 256, 128]
  value_hidden_sizes:  [512, 256, 128]

# --- Run-level -------------------------------------------------------------
seed: 0
wandb_project: robot-pet-cat
wandb_run_name: cat-amp-v1
log_interval_steps: 100000
checkpoint_interval_steps: 2000000
checkpoint_dir: checkpoints/motion
push_to_hub: true
hf_repo: jeffrah00/go2-cat-motion
