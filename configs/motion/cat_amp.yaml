# Tier 1 — AMP-trained cat-style locomotion on Unitree Go2.
# Numbers are sensible defaults; tune in Phase 2.

env:
  name: Go2Joystick           # mujoco_playground task id, wrapped with AMP rewards
  num_envs: 4096
  episode_length_s: 20
  action_repeat: 1
  command_velocity_range:
    vx: [-1.0, 1.5]
    vy: [-0.5, 0.5]
    yaw: [-1.0, 1.0]

amp:
  motion_clips_dir: data/motion_clips        # retargeted .npz files
  discriminator_hidden_sizes: [1024, 512]
  discriminator_lr: 1.0e-4
  style_reward_weight: 2.0                   # weight on log D(s, s')
  task_reward_weight: 1.0
  replay_buffer_size: 1_000_000

ppo:
  total_timesteps: 50_000_000
  unroll_length: 20
  num_minibatches: 32
  num_updates_per_batch: 4
  discounting: 0.97
  learning_rate: 3.0e-4
  entropy_cost: 1.0e-2
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  max_grad_norm: 1.0

network:
  policy_hidden_layer_sizes: [512, 256, 128]
  value_hidden_layer_sizes:  [512, 256, 128]
  activation: silu

domain_randomization:
  enabled: true
  friction_range: [0.4, 1.2]
  body_mass_range: [0.8, 1.2]
  action_latency_steps: [0, 3]
  push_interval_s: 7.0
  push_velocity_range: [0.0, 0.6]

logging:
  wandb_project: robot-pet-cat
  wandb_run_name: cat-amp-v1
  eval_interval_steps: 500_000
  checkpoint_interval_steps: 2_000_000

output:
  hf_repo: ${HF_USERNAME}/go2-cat-motion
  push_to_hub: true

seed: 0
