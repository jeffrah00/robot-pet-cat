# True AMP-PPO config for Go2 cat-style locomotion.
# Consumed by `rpc train-motion-v2 --config configs/motion/cat_amp_v2.yaml`.
# Maps onto src/robot_pet_cat/motion/amp_trainer_v2.py:AMPTrainConfigV2.
#
# train_v4 changes vs train_v3:
#   - motion_clips_dir: locomotion-only clips (no lying/grooming/play)
#   - disc_grad_penalty_coef: 1.0  (was 10.0 -- D was paralysed by R1)
#   - style_warmup_iters: 500      (was 200 -- v1 warm-start needed more time)
#   - style_ramp_iters: 100        (new -- linear ramp prevents PPO loss spikes)
#   - init_policy_ckpt: removed    (v1 warm-start put policy in bad minimum)

# --- AMP scalars -----------------------------------------------------------
# Locomotion-only clips: trot, walk, gallop, run. Lying/grooming/play clips
# excluded -- stationary poses gave the policy a free style reward for
# doing nothing, collapsing r_task.
motion_clips_dir: data/motion_clips_loco
style_reward_weight: 0.5
task_reward_weight: 1.0
use_qvel_in_features: false

# --- Discriminator hyperparams --------------------------------------------
disc_hidden_sizes: [1024, 512]
# Reduced from 10.0 -- R1 at 10.0 paralysed D throughout train_v3 (d_loss
# stuck at ~0.5, never converged). At 1.0 D can develop sharp real/fake
# boundaries without the gradient penalty dominating every update.
disc_grad_penalty_coef: 1.0
disc_learning_rate: 0.0001
disc_batch_size: 4096
disc_updates_per_iter: 1
disc_pretrain_steps: 200
# Increased from 200 -- cold-start (no v1 init) needs ~500 iters (~41M steps)
# to push r_task clearly positive before AMP engages.
style_warmup_iters: 500
# Linear ramp from sw=0 to sw=0.5 over 100 iters after warmup ends.
# Prevents the hard reward-distribution shift from destabilising PPO's value fn
# (train_v3 showed ppo_loss spikes to +2.0 at the hard switch point).
style_ramp_iters: 100

# --- Env -------------------------------------------------------------------
env_name: Go2JoystickFlatTerrain
num_envs: 4096
episode_length_s: 20.0

# --- PPO -------------------------------------------------------------------
ppo:
  total_iterations: 5000
  unroll_length: 20
  num_minibatches: 32
  num_updates_per_batch: 4
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  entropy_cost: 0.01
  learning_rate: 0.0003
  max_grad_norm: 1.0
  policy_hidden_sizes: [512, 256, 128]
  value_hidden_sizes:  [512, 256, 128]

# --- Run-level -------------------------------------------------------------
seed: 0
log_interval_iters: 10
eval_interval_iters: 100
checkpoint_interval_iters: 500
checkpoint_dir: checkpoints/motion_v2

# init_policy_ckpt removed for train_v4: the v1 warm-start landed the policy
# in a bad minimum (r_task never exceeded +0.016 in warmup). Cold-start with
# 500 warmup iters instead.
