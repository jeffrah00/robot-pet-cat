[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-pet-cat"
version = "0.0.1"
description = "Simulated robot pet cat: AMP-trained quadruped + curiosity-driven brain with mood."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jeff" }]

dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
motion = [
    "torch>=2.3",
    "jax[cuda12]>=0.4.30; sys_platform == 'linux'",
    "jax>=0.4.30; sys_platform != 'linux'",
    "ml_dtypes>=0.4.0",
    "brax>=0.10",
    "mujoco-mjx>=3.2",
    "playground @ git+https://github.com/google-deepmind/mujoco_playground.git",
    "wandb>=0.17",
    # Rendering trained policies to MP4 in scripts/render_motion_policy.py.
    # imageio handles the encode loop, imageio-ffmpeg ships the ffmpeg binary
    # so users don't need a system install.
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

brain = [
    "torch>=2.3",
    "gymnasium>=1.0",
    "wandb>=0.17",
    "huggingface-hub>=0.24",
]

retargeting = [
    "opencv-python>=4.10",
    "scipy>=1.13",
]

# Real pose extraction via DLC SuperAnimal-Quadruped.
pose = [
    "deeplabcut>=2.3.11",
    "tensorflow>=2.13,<2.16",
    "opencv-python>=4.10",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "pre-commit>=3.7",
]

[project.scripts]
rpc = "robot_pet_cat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["te