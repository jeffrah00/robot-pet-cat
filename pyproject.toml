[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-pet-cat"
version = "0.0.1"
description = "Simulated robot pet cat: AMP-trained quadruped + curiosity-driven brain with mood."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jeff" }]

# Core deps kept light. Heavier deps (training, retargeting, pose) live in
# extras so the package installs quickly on machines that only need part of
# the stack.
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Tier 1 motion: AMP-style RL on top of MuJoCo Playground.
motion = [
    "torch>=2.3",
    "jax[cuda12]>=0.4.30; sys_platform == 'linux'",
    "jax>=0.4.30; sys_platform != 'linux'",
    "brax>=0.10",
    "mujoco-mjx>=3.2",
    "playground @ git+https://github.com/google-deepmind/mujoco_playground.git",
    "wandb>=0.17",
]

# Tier 2 skills + Tier 3 brain: share the same RL stack.
brain = [
    "torch>=2.3",
    "wandb>=0.17",
    "huggingface-hub>=0.24",
]

# Retargeting math (Phase 2a, no perception model needed for tests/synth).
retargeting = [
    "opencv-python>=4.10",
    "scipy>=1.13",
]

# Real pose extraction from .mp4 (DLC SuperAnimal-Quadruped).
# Heavier dep set; deeplabcut transitively brings in pytables/pandas so we
# don't pin them here (DLC 2.3.x pins tables==3.8.0 and conflicts otherwise).
pose = [
    "deeplabcut>=2.3.11",
    "opencv-python>=4.10",
]

# Dev tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "pre-commit>=3.7",
]

[project.scripts]
rpc = "robot_pet_cat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
